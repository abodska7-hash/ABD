<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>نظام متابعة طلبيات المعمل - شركة الرفادة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 select-none">

  <!-- LOGIN SCREEN (Displays when no user is logged in) -->
  <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm shadow-2xl space-y-5">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto text-emerald-400 text-xl font-black">
          🌿
        </div>
        <h1 class="text-base font-black text-white pt-2">شركة الرفادة للصناعة والتجارة</h1>
        <p class="text-[11px] text-slate-400">نظام إدارة ومتابعة طلبيات المعمل</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] text-slate-300 font-bold mb-1.5">اختر القسم / المستخدم:</label>
          <select id="login-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
            <option value="commercial">المدير التجاري (أ. ملهم)</option>
            <option value="accountant">المحاسب</option>
            <option value="supervisor">إدارة الإنتاج</option>
            <option value="production_floor">صالة الإنتاج والخلط</option>
            <option value="packaging_floor">صالة التعبئة والتغليف</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] text-slate-300 font-bold mb-1.5">الرمز السري (PIN):</label>
          <input type="password" id="login-pin" maxlength="6" inputmode="numeric" required placeholder="أدخل الرمز السري..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-center text-sm font-mono tracking-widest text-emerald-400 outline-none focus:border-emerald-500" />
          <p id="login-error" class="text-rose-400 text-[10px] mt-1.5 text-center hidden font-bold">الرمز السري غير صحيح، يرجى المحاولة ثانية</p>
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950 transition">
          تسجيل الدخول ➔
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP (Displays after login) -->
  <div id="main-app" class="hidden">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-40 flex items-center justify-between shadow-md">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-xs font-black text-white">مسار طلبيات المعمل - الرفادة</h1>
        </div>
        <p class="text-[10px] text-emerald-400 mt-0.5" id="header-user-name">...</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="header-role-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 font-bold">...</span>
        <button onclick="logout()" class="text-[10px] px-2 py-1 rounded-lg bg-rose-950/40 text-rose-300 hover:bg-rose-900 border border-rose-800/50 transition">
          خروج 🚪
        </button>
      </div>
    </header>

    <main class="p-3.5 space-y-3.5 max-w-2xl mx-auto">

      <!-- KPI Summary -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl">
          <span class="text-[10px] text-slate-400 block">إجمالي النشط</span>
          <span id="stat-active" class="font-bold text-white text-sm">0</span>
        </div>
        <div class="bg-rose-950/30 border border-rose-500/40 p-2 rounded-xl">
          <span class="text-[10px] text-rose-400 font-bold block" id="stat-missing-label">نواقص مشتريات</span>
          <span id="stat-missing" class="font-bold text-rose-400 text-sm">0</span>
        </div>
        <div class="bg-emerald-950/30 border border-emerald-500/30 p-2 rounded-xl">
          <span class="text-[10px] text-emerald-400 block">جاهز للتسليم</span>
          <span id="stat-completed" class="font-bold text-emerald-400 text-sm">0</span>
        </div>
      </div>

      <!-- Commercial Entry Form (Only visible to Commercial Role) -->
      <div id="panel-commercial-input" class="bg-slate-900 border border-emerald-500/30 p-3.5 rounded-2xl shadow-xl hidden">
        <h2 class="text-xs font-bold text-emerald-400 mb-2.5 flex items-center gap-1.5">
          <span>📥</span> تسجيل طلبية جديدة من التاجر / الزبون
        </h2>
        <form onsubmit="createCommercialOrder(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">اسم الزبون / التاجر</label>
              <input type="text" id="comm_client" required placeholder="مثال: زياد المصري" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">الأولوية</label>
              <select id="comm_priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white outline-none">
                <option value="عادي">عادي</option>
                <option value="مستعجل">🔥 مستعجل</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[10px] text-slate-400 mb-1">ملاحظة عامة على الطلبية ككل (اختياري)</label>
            <input type="text" id="comm_general_note" placeholder="مثال: شحنة مستعجلة - تسليم للمستودع" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
          </div>

          <div class="border-t border-slate-800/80 pt-2.5">
            <label class="block text-[11px] font-bold text-slate-300 mb-2">أصناف ومواد الطلبية مع الملاحظات والوجهة:</label>
            <div id="items-entry-container" class="space-y-2.5">
              <div class="item-input-group bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-2 relative">
                <div class="grid grid-cols-3 gap-2">
                  <div class="col-span-2">
                    <input type="text" placeholder="اسم المادة (مثال: زعتر اخضر 10 كغ)" required class="item-name w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>
                  <div>
                    <input type="text" placeholder="الكمية" required class="item-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
                  </div>
                </div>
                <div>
                  <input type="text" placeholder="ملاحظة المادة (مثال: وجهة الإمارات - صلاحية سنتين)" class="item-note w-full bg-slate-900/70 border border-slate-800/80 text-amber-200 placeholder-slate-500 rounded-lg px-2 py-1 text-[11px] outline-none focus:border-amber-500/50" />
                </div>
              </div>
            </div>

            <div class="flex gap-2 mt-2.5">
              <button type="button" onclick="addNewItemRow()" class="w-1/2 py-2 text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl font-bold">
                + إضافة صنف آخر
              </button>
              <button type="submit" class="w-1/2 py-2 text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-950">
                إرسال للمحاسب ➔
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Orders List Header -->
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold text-slate-300">سجل الطلبيات الحالية:</h3>
        <span class="text-[10px] text-slate-500" id="current-filter-desc">محدث فورياً</span>
      </div>

      <!-- Cards Container -->
      <div id="orders-container" class="space-y-3"></div>

    </main>
  </div>

  <script>
    // Configuration of Roles and PIN Codes
    const ROLES = {
      commercial: { name: "أ. ملهم (المدير التجاري)", title: "المدير التجاري", pin: "1111", isSecretPrivileged: true },
      accountant: { name: "محاسب المعمل", title: "المحاسب", pin: "2222", isSecretPrivileged: false },
      supervisor: { name: "إدارة الإنتاج", title: "إدارة الإنتاج", pin: "3333", isSecretPrivileged: true },
      production_floor: { name: "صالة الإنتاج والخلط", title: "صالة الإنتاج", pin: "4444", isSecretPrivileged: true },
      packaging_floor: { name: "صالة التعبئة والتغليف", title: "صالة التعبئة", pin: "5555", isSecretPrivileged: false }
    };

    let currentUserRole = localStorage.getItem('alrefada_logged_role') || null;

    const statusConfig = {
      with_accountant: { label: "عند المحاسب (تدقيق)", color: "text-amber-400 bg-amber-500/10 border-amber-500/30" },
      with_supervisor: { label: "بانتظار إذن الإنتاج", color: "text-blue-400 bg-blue-500/10 border-blue-500/30" },
      in_production: { label: "قيد الخلط بالصالة", color: "text-cyan-400 bg-cyan-500/10 border-cyan-500/30" },
      missing_materials: { label: "🛑 نقص مواد مشتريات", color: "text-rose-400 bg-rose-500/20 border-rose-500/40 font-bold" },
      in_packaging: { label: "في صالة التعبئة والتغليف", color: "text-purple-400 bg-purple-500/10 border-purple-500/30" },
      ready: { label: "جاهز للتسليم بالمستودع ✓", color: "text-emerald-400 bg-emerald-500/15 border-emerald-500/40 font-bold" }
    };

    let orders = JSON.parse(localStorage.getItem('alrefada_orders_secure')) || [
      {
        id: 101,
        client: "زياد المصري",
        priority: "مستعجل",
        items: [
          { name: "زعتر اخضر ملوكي 10 كغ", qty: "50 كيس (500 كغ)", note: "وجهة: الإمارات - صلاحية سنتين حتى 09/2028" },
          { name: "سماق بلدي فاخر", qty: "25 شوال (250 كغ)", note: "وجهة: مستودع دمشق" }
        ],
        status: "missing_materials",
        missingList: ["150 كغ سمسم محمص بلدي", "50 كيس خيش مخصص للتصدير"],
        deptNotes: [
          { role: "المدير التجاري", text: "الزبون بحاجة لاستلام الطلبية لنهاية الأسبوع", time: "10:30 ص" }
        ],
        log: "سجلت صالة الإنتاج نقص مواد لتجهيز الطلب"
      }
    ];

    function save() {
      localStorage.setItem('alrefada_orders_secure', JSON.stringify(orders));
      render();
    }

    // Login Handling
    function handleLogin(e) {
      e.preventDefault();
      const roleKey = document.getElementById('login-role').value;
      const enteredPin = document.getElementById('login-pin').value.trim();
      const errBox = document.getElementById('login-error');

      if (ROLES[roleKey] && ROLES[roleKey].pin === enteredPin) {
        currentUserRole = roleKey;
        localStorage.setItem('alrefada_logged_role', roleKey);
        errBox.classList.add('hidden');
        document.getElementById('login-pin').value = '';
        checkAuth();
      } else {
        errBox.classList.remove('hidden');
      }
    }

    function logout() {
      if (confirm("هل تريد تسجيل الخروج؟")) {
        currentUserRole = null;
        localStorage.removeItem('alrefada_logged_role');
        checkAuth();
      }
    }

    function checkAuth() {
      const loginScreen = document.getElementById('login-screen');
      const mainApp = document.getElementById('main-app');

      if (!currentUserRole || !ROLES[currentUserRole]) {
        loginScreen.classList.remove('hidden');
        mainApp.classList.add('hidden');
      } else {
        loginScreen.classList.add('hidden');
        mainApp.classList.remove('hidden');

        document.getElementById('header-user-name').innerText = ROLES[currentUserRole].name;
        document.getElementById('header-role-badge').innerText = ROLES[currentUserRole].title;

        // Display commercial entry panel only for commercial role
        const commPanel = document.getElementById('panel-commercial-input');
        if (currentUserRole === 'commercial') {
          commPanel.classList.remove('hidden');
        } else {
          commPanel.classList.add('hidden');
        }

        render();
      }
    }

    function addNewItemRow() {
      const container = document.getElementById('items-entry-container');
      const div = document.createElement('div');
      div.className = "item-input-group bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-2 relative";
      div.innerHTML = `
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <input type="text" placeholder="اسم المادة" required class="item-name w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
          </div>
          <div>
            <input type="text" placeholder="الكمية" required class="item-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:border-emerald-500" />
          </div>
        </div>
        <div>
          <input type="text" placeholder="ملاحظة المادة (الوجهة / الصلاحية)" class="item-note w-full bg-slate-900/70 border border-slate-800/80 text-amber-200 placeholder-slate-500 rounded-lg px-2 py-1 text-[11px] outline-none focus:border-amber-500/50" />
        </div>
        <button type="button" onclick="this.closest('.item-input-group').remove()" class="text-rose-500 text-[10px] font-bold">حذف المادة ✕</button>
      `;
      container.appendChild(div);
    }

    function createCommercialOrder(e) {
      e.preventDefault();
      const rows = document.querySelectorAll('.item-input-group');
      const items = [];
      rows.forEach(r => {
        const name = r.querySelector('.item-name').value.trim();
        const qty = r.querySelector('.item-qty').value.trim();
        const note = r.querySelector('.item-note').value.trim();
        if (name && qty) items.push({ name, qty, note });
      });

      if (items.length === 0) return;

      const generalNote = document.getElementById('comm_general_note').value.trim();
      const initialNotes = [];
      if (generalNote) {
        initialNotes.push({
          role: ROLES[currentUserRole].title,
          text: generalNote,
          time: new Date().toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit' })
        });
      }

      const nextId = orders.length > 0 ? Math.max(...orders.map(o => o.id)) + 1 : 101;
      orders.unshift({
        id: nextId,
        client: document.getElementById('comm_client').value.trim(),
        priority: document.getElementById('comm_priority').value,
        items: items,
        status: 'with_accountant',
        missingList: [],
        deptNotes: initialNotes,
        log: 'تم إنشاء الطلبية وتحويلها للمحاسب للتدقيق'
      });

      e.target.reset();
      save();
    }

    // Role Actions
    function accountantApprove(id) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = 'with_supervisor';
        ord.log = 'تم تدقيق الطلب وتثبيته وتحويله لإدارة الإنتاج';
        save();
      }
    }

    function supervisorDispatch(id) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = 'in_production';
        ord.log = 'إصدار أمر البدء لصالة الإنتاج والخلط';
        save();
      }
    }

    function productionAddMissing(id) {
      const raw = prompt("سري للمدير التجاري: اكتب المواد الناقصة لتأمينها (افصل بفاصلة):");
      if (raw && raw.trim() !== '') {
        const items = raw.split(/[,،+]/).map(s => s.trim()).filter(Boolean);
        const ord = orders.find(o => o.id === id);
        if (ord) {
          ord.status = 'missing_materials';
          ord.missingList = items;
          ord.log = 'بانتظار شراء مواد وتوريدها للمعمل من الإدارة التجارية';
          save();
        }
      }
    }

    function commercialResolveMissing(id) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = 'in_production';
        ord.missingList = [];
        ord.log = 'أكد أ. ملهم شراء وتوريد المواد للمعمل - استئناف العمل';
        save();
      }
    }

    function sendToPackaging(id) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = 'in_packaging';
        ord.log = 'تم تجهيز وخلط المواد بالكامل ➔ تم التسليم لصالة التعبئة';
        save();
      }
    }

    function completePackaging(id) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = 'ready';
        ord.log = 'تمت التعبئة والتغليف مع التحقق من تواريخ الصلاحية والوجهة ✓';
        save();
      }
    }

    function addGeneralNote(id) {
      const noteText = prompt("اكتب ملاحظتك على هذه الطلبية:");
      if (noteText && noteText.trim() !== "") {
        const ord = orders.find(o => o.id === id);
        if (ord) {
          if (!ord.deptNotes) ord.deptNotes = [];
          ord.deptNotes.push({
            role: ROLES[currentUserRole].title,
            text: noteText.trim(),
            time: new Date().toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit' })
          });
          save();
        }
      }
    }

    function render() {
      if (!currentUserRole) return;

      const userConf = ROLES[currentUserRole];
      const isPrivileged = userConf.isSecretPrivileged; // Can view secret missing materials

      // Update KPI Counter Labels based on secrecy
      document.getElementById('stat-active').innerText = orders.filter(o => o.status !== 'ready').length;
      document.getElementById('stat-completed').innerText = orders.filter(o => o.status === 'ready').length;
      
      if (isPrivileged) {
        document.getElementById('stat-missing-label').innerText = "نواقص مشتريات";
        document.getElementById('stat-missing').innerText = orders.filter(o => o.status === 'missing_materials').length;
      } else {
        document.getElementById('stat-missing-label').innerText = "قيد المتابعة";
        document.getElementById('stat-missing').innerText = orders.filter(o => o.status === 'missing_materials').length;
      }

      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs">لا توجد طلبيات حالياً</div>`;
        return;
      }

      orders.forEach(o => {
        const card = document.createElement('div');
        const isMissing = o.status === 'missing_materials';

        // Styling: Highlight red only if user is authorized to see missing materials
        if (isMissing && isPrivileged) {
          card.className = "p-3.5 rounded-2xl border transition bg-rose-950/25 border-rose-500/50 shadow-lg shadow-rose-950/40";
        } else {
          card.className = "p-3.5 rounded-2xl border transition bg-slate-900 border-slate-800";
        }

        // Mask Status Title for non-privileged roles (Packaging & Accountant)
        let displayStatusLabel = statusConfig[o.status].label;
        let displayStatusColor = statusConfig[o.status].color;

        if (isMissing && !isPrivileged) {
          displayStatusLabel = "قيد التجهيز الداخلي بالمعمل";
          displayStatusColor = "text-amber-400 bg-amber-500/10 border-amber-500/30";
        }

        // Render Items List with Per-Item Notes (Destinations/Dates)
        let itemsHtml = (o.items || []).map(it => `
          <div class="py-2 border-b border-slate-800/80 last:border-0">
            <div class="flex justify-between items-start gap-2">
              <span class="font-bold text-slate-200 text-xs">• ${it.name}</span>
              <span class="font-mono text-emerald-400 text-[11px] font-bold bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-500/20 whitespace-nowrap">${it.qty}</span>
            </div>
            ${it.note ? `
              <div class="mt-1 flex items-center gap-1.5 text-[10px] text-amber-300 bg-amber-950/30 px-2 py-1 rounded border border-amber-500/20">
                <span>📌</span>
                <span>${it.note}</span>
              </div>
            ` : ''}
          </div>
        `).join('');

        // Secret Missing Materials Box (Strictly Gated)
        let missingBoxHtml = '';
        if (isMissing) {
          if (isPrivileged && o.missingList && o.missingList.length > 0) {
            missingBoxHtml = `
              <div class="mt-2.5 p-2.5 rounded-xl bg-rose-950/60 border border-rose-500/40">
                <span class="text-[10px] font-bold text-rose-300 block mb-1">🔒 سري (نواقص مشتريات مطلوبة من أ. ملهم):</span>
                <div class="flex flex-wrap gap-1">
                  ${o.missingList.map(m => `<span class="bg-rose-900/80 text-rose-200 border border-rose-700/60 px-2 py-0.5 rounded-lg text-[10px] font-medium">• ${m}</span>`).join('')}
                </div>
              </div>
            `;
          } else if (!isPrivileged) {
            missingBoxHtml = `
              <div class="mt-2 p-2 rounded-xl bg-slate-950/50 border border-slate-800 text-[11px] text-slate-400 flex items-center gap-1.5">
                <span>⏳</span> الطلبية قيد المتابعة والتجهيز الداخلي بالمعمل.
              </div>
            `;
          }
        }

        // Department Notes Log
        let notesHtml = '';
        if (o.deptNotes && o.deptNotes.length > 0) {
          notesHtml = `
            <div class="mt-2 bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80 space-y-1.5">
              <span class="text-[10px] font-bold text-slate-400 block">💬 تنبيهات الأقسام:</span>
              ${o.deptNotes.map(n => `
                <div class="text-[11px] bg-slate-900/90 p-1.5 rounded-lg border border-slate-800 flex justify-between items-start gap-2">
                  <div>
                    <span class="text-emerald-400 font-bold text-[10px] ml-1">[${n.role}]:</span>
                    <span class="text-slate-200">${n.text}</span>
                  </div>
                  <span class="text-[9px] text-slate-500 whitespace-nowrap font-mono">${n.time}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        // Action Buttons strictly filtered by logged-in role
        let actionArea = '';

        if (currentUserRole === 'commercial' && o.status === 'missing_materials') {
          actionArea = `
            <div class="mt-2.5 pt-2 border-t border-slate-800">
              <button onclick="commercialResolveMissing(${o.id})" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950 flex items-center justify-center gap-1.5">
                <span>✓</span> تم شراء وتأمين كافة النواقص للمعمل
              </button>
            </div>
          `;
        } else if (currentUserRole === 'accountant' && o.status === 'with_accountant') {
          actionArea = `
            <div class="mt-2.5 pt-2 border-t border-slate-800">
              <button onclick="accountantApprove(${o.id})" class="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold">
                ✓ تدقيق واعتماد الطلبية وإرسالها لإدارة الإنتاج
              </button>
            </div>
          `;
        } else if (currentUserRole === 'supervisor' && o.status === 'with_supervisor') {
          actionArea = `
            <div class="mt-2.5 pt-2 border-t border-slate-800">
              <button onclick="supervisorDispatch(${o.id})" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold">
                إصدار أمر البدء وإرسال لصالة الإنتاج ➔
              </button>
            </div>
          `;
        } else if (currentUserRole === 'production_floor' && o.status === 'in_production') {
          actionArea = `
            <div class="grid grid-cols-2 gap-2 mt-2.5 pt-2 border-t border-slate-800">
              <button onclick="sendToPackaging(${o.id})" class="py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold">
                تم الخلط ➔ للتعبئة
              </button>
              <button onclick="productionAddMissing(${o.id})" class="py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold">
                تسجيل نقص مواد 🛑
              </button>
            </div>
          `;
        } else if (currentUserRole === 'packaging_floor' && o.status === 'in_packaging') {
          actionArea = `
            <div class="mt-2.5 pt-2 border-t border-slate-800">
              <button onclick="completePackaging(${o.id})" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-950">
                إتمام التعبئة ومطابقة الوجهة والتاريخ ✓
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2 mb-1.5">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-mono font-bold text-slate-400">#${o.id}</span>
                <span class="text-sm font-bold text-white">${o.client}</span>
              </div>
            </div>
            <div class="flex gap-1 items-center">
              <span class="text-[9px] px-2 py-0.5 rounded-full font-bold ${o.priority === 'مستعجل' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800 text-slate-400'}">${o.priority}</span>
              <span class="text-[9px] px-2 py-0.5 rounded-full border ${displayStatusColor}">${displayStatusLabel}</span>
            </div>
          </div>

          <div class="bg-slate-950/60 px-3 py-1.5 rounded-xl border border-slate-800/80 my-2">
            ${itemsHtml}
          </div>

          ${missingBoxHtml}
          ${notesHtml}

          <div class="flex justify-between items-center mt-2.5 pt-2 border-t border-slate-800/60 text-[10px]">
            <span class="text-slate-400">الحالة: <span class="text-slate-300 font-medium">${o.log}</span></span>
            <button onclick="addGeneralNote(${o.id})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg border border-slate-700 font-bold transition flex items-center gap-1">
              <span>💬</span> ملاحظة
            </button>
          </div>

          ${actionArea}
        `;

        container.appendChild(card);
      });
    }

    // Initialize application check
    checkAuth();
  </script>
</body>
</html>
